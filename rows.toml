# The architecture rows (plan 04.4 and 09.4): the image each row boots and its QEMU machine.
# A row with a later milestone in from is written down now so that its names are decided once.

[row.amd64]
from = "P0"
rucc_arch = "x86_64"
letter = "6"
image = "amd64.qcow2"
kernel = "9pc64"
qemu = "qemu-system-x86_64"
machine = "q35"
cpu_hw = "host"
cpu_tcg = "max"
cpus = 4
memory_gb = 4
firmware = "bios"                   # the image boots with 9bootfat from the BIOS
disk = "virtio"
run_limit_hours = 4

[row.arm64]
from = "P0"
rucc_arch = "aarch64"
letter = "7"
image = "arm64.qcow2"
kernel = "9qemu"
qemu = "qemu-system-aarch64"
# The 9qemu kernel of 11952 has its PCI ECAM at 0x3F000000. QEMU puts the ECAM high unless
# highmem-ecam=off, and then the kernel panics in kenter.
machine = "virt,gic-version=3,highmem-ecam=off"
cpu_hw = "host"
cpu_tcg = "max"
# On newer QEMU, the other CPUs of the 11952 kernel stop at a WFE in _start that no SEV
# ends. 9front removed the WFE in ba5324e3f. Until a release has that change, use one CPU.
cpus = 1
memory_gb = 4
firmware = "u-boot"                 # the image has a boot.scr that loads plan9.ini and 9qemu.u
disk = "virtio"
run_limit_hours = 6

[row.386]
from = "P10"
rucc_arch = "i686"
letter = "8"
image = "386.iso"
kernel = "9pc"
qemu = "qemu-system-i386"
machine = "pc"
cpu_hw = "host"
cpu_tcg = "max"
cpus = 2
memory_gb = 2
firmware = "bios"
disk = "ahci"
run_limit_hours = 6
