[package]
name = "r9-rusage"
description = "Run a child process and give its CPU time and its peak resident memory, from wait4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# This crate has the one call to the C library that r9 needs, so it does not take the workspace
# lints, which forbid unsafe code. The other lints are the same.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
