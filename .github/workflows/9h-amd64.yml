# The 9h kernel for amd64 on KVM (plan 10.4 and 10.8). The hosted runners have KVM.
#
# The job makes the g-base image of the pinned tree, as g-base.yml does. r9 build --side G with
# the target 9h.amd64 then builds the 9h kernel in the guest with the compilers of the tree. r9
# 9h verify checks the sources of the build against sys/src/9 of the pin. The job builds the 9h
# monitor, and r9 9h boot boots the kernel on the g-base image and runs smoke/boot.rc on its
# console. The monitor logs each port and address with no device that the kernel used. A second
# boot with --strict stops the machine at the first such access. r9 9h smoke --snap boots the
# kernel with a screen on 4 processors, starts rio, and runs the smoke suite in the console
# window. The console logs, the steps, the logs of the monitor, the screen, the compile records
# and the kernel go to an artifact.

name: 9h amd64

on:
  pull_request:
    paths:
      - 9h/**
      - guest/r9-build
      - crates/r9/src/build.rs
      - crates/r9/src/h9boot.rs
      - crates/r9/src/boot.rs
      - crates/r9/src/image.rs
      - smoke/boot.rc
      - .github/workflows/9h-amd64.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  R9_CACHE: /mnt/r9

jobs:
  boot:
    name: 9h boot amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            9h/monitor -> target
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-utils qemu-system-x86
          sudo mkdir -p /mnt/r9 && sudo chown "$USER" /mnt/r9
      - name: cargo build
        run: |
          cargo build --release --locked -p r9
          cd 9h/monitor && cargo build --release --locked
      - uses: actions/cache@v6.1.0
        with:
          path: /mnt/r9/images
          key: r9-images-amd64-${{ hashFiles('pins.toml') }}
          restore-keys: r9-images-amd64-
      - name: r9 fetch
        run: target/release/r9 fetch --row amd64
      - name: r9 image build
        run: target/release/r9 image build --row amd64 --accel kvm --out "$RUNNER_TEMP/image"
      - name: r9 build, the target 9h.amd64
        run: target/release/r9 build --side G --row amd64 --accel kvm --targets 9h.amd64 --out "$RUNNER_TEMP/k"
      - name: r9 9h verify
        run: target/release/r9 9h verify --records "$RUNNER_TEMP/k/collected/compile.jsonl" --row amd64
      - name: r9 9h boot
        run: |
          root=$(ls /mnt/r9/images/g-base-*.amd64.qcow2 | head -1)
          target/release/r9 9h boot --kernel "$RUNNER_TEMP/k/collected/9h/amd64/99h" --root "$root" --timeout 900 --out "$RUNNER_TEMP/boot"
          grep '^9h: no device' "$RUNNER_TEMP/boot/9h.stderr" || true
      - name: r9 9h boot --strict
        run: |
          root=$(ls /mnt/r9/images/g-base-*.amd64.qcow2 | head -1)
          target/release/r9 9h boot --kernel "$RUNNER_TEMP/k/collected/9h/amd64/99h" --root "$root" --timeout 900 --strict --out "$RUNNER_TEMP/strict"
          if grep '^9h: no device' "$RUNNER_TEMP/strict/9h.stderr"; then exit 1; fi
      - name: r9 9h smoke --snap
        run: |
          root=$(ls /mnt/r9/images/g-base-*.amd64.qcow2 | head -1)
          target/release/r9 9h smoke --kernel "$RUNNER_TEMP/k/collected/9h/amd64/99h" --root "$root" --cpus 4 --snap "$RUNNER_TEMP/rio/screen.png" --timeout 900 --out "$RUNNER_TEMP/rio"
      - name: gather the results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out/k" "$RUNNER_TEMP/out/boot" "$RUNNER_TEMP/out/strict" "$RUNNER_TEMP/out/rio"
          cp "$RUNNER_TEMP/k"/*.toml "$RUNNER_TEMP/k"/console.log "$RUNNER_TEMP/out/k/" || true
          cp "$RUNNER_TEMP/k/collected/mk.log" "$RUNNER_TEMP/k/collected/compile.jsonl" "$RUNNER_TEMP/out/k/" || true
          cp -r "$RUNNER_TEMP/k/collected/9h" "$RUNNER_TEMP/out/k/" || true
          cp "$RUNNER_TEMP/rio/screen.png" "$RUNNER_TEMP/out/rio/" || true
          for d in boot strict rio; do
            cp "$RUNNER_TEMP/$d"/console.log "$RUNNER_TEMP/$d"/steps.json "$RUNNER_TEMP/$d"/9h.cmd "$RUNNER_TEMP/$d"/9h.stderr "$RUNNER_TEMP/out/$d/" || true
          done
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: 9h-amd64
          path: ${{ runner.temp }}/out
          retention-days: 30
