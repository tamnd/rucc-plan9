# The arm64 build of P4 under TCG (plan 16.5). The plan runs this build on gpc under TCG, and gpc
# is not reachable, so a hosted x86-64 runner runs it under TCG. The M4 runs the same build under
# HVF.
#
# The job builds rucc at the pin below, makes the g-base image of arm64 under TCG, and builds the
# arm64 user space with rucc and -O2 and with no bring-up. The build fails when a call goes to
# kencc, or when the census line is not GRADED.

name: p4 arm64

on:
  pull_request:
    paths:
      - .github/workflows/p4-arm64.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  R9_CACHE: /mnt/r9
  # The commit of tamnd/rucc that builds the R user space.
  RUCC_PIN: ead210602789e45bc5593fc42265d048efefef55

jobs:
  r:
    name: R build arm64 under TCG
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          ref: ${{ env.RUCC_PIN }}
          path: rucc
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            rucc -> target
      - name: QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-utils qemu-system-arm u-boot-qemu
          sudo mkdir -p /mnt/r9 && sudo chown "$USER" /mnt/r9
      - name: cargo build
        run: |
          cargo build --release --locked -p r9
          (cd rucc && cargo build --release --locked -p rucc)
      - uses: actions/cache@v6.1.0
        with:
          path: /mnt/r9/images
          key: r9-images-arm64-${{ hashFiles('pins.toml') }}
          restore-keys: r9-images-arm64-
      - name: r9 fetch
        run: target/release/r9 fetch --row arm64
      - name: r9 image build
        run: target/release/r9 image build --row arm64 --accel tcg --timeout 7200 --out "$RUNNER_TEMP/image"
      - name: r9 build --side R
        env:
          R9_RUCC: ${{ github.workspace }}/rucc/target/release/rucc
          R9_OPT: -O2
          R9_BRINGUP: ''
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          target/release/r9 build --side R --row arm64 --accel tcg --timeout 16200 --out /mnt/r9/r | tee "$RUNNER_TEMP/out/build.txt"
          grep -E '^(passed|build_seconds|calls|failed_calls|rucc_calls|kencc_calls) ' /mnt/r9/r/build.toml
          grep -qx 'kencc_calls = 0' /mnt/r9/r/build.toml
          grep -q '^GRADED: ref-c 0' "$RUNNER_TEMP/out/build.txt"
      - name: gather the results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp /mnt/r9/r/build.toml /mnt/r9/r/console.log "$RUNNER_TEMP/out/" || true
          cp /mnt/r9/r/collected/mk.log /mnt/r9/r/collected/rucc.err "$RUNNER_TEMP/out/" || true
          grep -E '^(GRADED|UNGRADED|build passed)' "$RUNNER_TEMP/out/build.txt" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: p4-arm64-r
          path: ${{ runner.temp }}/out
          retention-days: 30
