# The exit criterion of P3 on amd64 with KVM (plan 16.4). The hosted runners have KVM.
#
# The job r builds rucc at the pin below and builds the amd64 user space with rucc and -O2. The
# step fails when a call goes to kencc. Then r9 2x2 runs the suites test, smoke and diffrun on R
# user space with the G kernel. The job fp builds the user space with rucc again, and r9
# fixedpoint builds the tree with the kencc of that build and compares it with G. The job g
# builds the user space with kencc. The job names compares the names and the modes of the files
# that the R build and the G build wrote, with r9 tree-diff --names.

name: p3 amd64

on:
  pull_request:
    paths:
      - .github/workflows/p3-amd64.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  R9_CACHE: /mnt/r9
  # The commit of tamnd/rucc that builds the R user space.
  RUCC_PIN: ead210602789e45bc5593fc42265d048efefef55

jobs:
  r:
    name: R user space on the G kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          ref: ${{ env.RUCC_PIN }}
          path: rucc
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            rucc -> target
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-utils qemu-system-x86
          sudo mkdir -p /mnt/r9 && sudo chown "$USER" /mnt/r9
      - name: cargo build
        run: |
          cargo build --release --locked -p r9
          (cd rucc && cargo build --release --locked -p rucc)
      - uses: actions/cache@v6.1.0
        with:
          path: /mnt/r9/images
          key: r9-images-amd64-${{ hashFiles('pins.toml') }}
          restore-keys: r9-images-amd64-
      - name: r9 fetch
        run: target/release/r9 fetch --row amd64
      - name: r9 image build
        run: target/release/r9 image build --row amd64 --accel kvm --out "$RUNNER_TEMP/image"
      - name: r9 build --side R
        env:
          R9_RUCC: ${{ github.workspace }}/rucc/target/release/rucc
          R9_OPT: -O2
        run: |
          target/release/r9 build --side R --row amd64 --accel kvm --keep --timeout 5400 --out /mnt/r9/r
          grep -E '^(passed|calls|failed_calls|rucc_calls|kencc_calls) ' /mnt/r9/r/build.toml
          grep -qx 'kencc_calls = 0' /mnt/r9/r/build.toml
      - name: r9 2x2 test
        run: target/release/r9 2x2 test --r /mnt/r9/r/root.qcow2 --row amd64 --accel kvm --out "$RUNNER_TEMP/out/2x2/test"
      - name: r9 2x2 smoke
        if: always()
        run: target/release/r9 2x2 smoke --r /mnt/r9/r/root.qcow2 --row amd64 --accel kvm --out "$RUNNER_TEMP/out/2x2/smoke"
      - name: r9 2x2 diffrun
        if: always()
        run: target/release/r9 2x2 diffrun --r /mnt/r9/r/root.qcow2 --row amd64 --accel kvm --out "$RUNNER_TEMP/out/2x2/diffrun"
      - name: gather the results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out/r" "$RUNNER_TEMP/walk/r"
          cp /mnt/r9/r/build.toml /mnt/r9/r/console.log "$RUNNER_TEMP/out/r/" || true
          cp /mnt/r9/r/collected/mk.log /mnt/r9/r/collected/rucc.err "$RUNNER_TEMP/out/r/" || true
          cp /mnt/r9/r/collected/walk /mnt/r9/r/collected/changed.sha256 /mnt/r9/r/collected/members.sha256 "$RUNNER_TEMP/walk/r/" || true
          for s in test smoke diffrun; do echo "$s: $(tail -1 "$RUNNER_TEMP/out/2x2/$s/2x2.txt" 2>/dev/null)"; done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: p3-amd64-r
          path: ${{ runner.temp }}/out
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: p3-amd64-walk-r
          path: ${{ runner.temp }}/walk/r
          retention-days: 30

  fp:
    name: the fixed point
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          ref: ${{ env.RUCC_PIN }}
          path: rucc
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            rucc -> target
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-utils qemu-system-x86
          sudo mkdir -p /mnt/r9 && sudo chown "$USER" /mnt/r9
      - name: cargo build
        run: |
          cargo build --release --locked -p r9
          (cd rucc && cargo build --release --locked -p rucc)
      - uses: actions/cache@v6.1.0
        with:
          path: /mnt/r9/images
          key: r9-images-amd64-${{ hashFiles('pins.toml') }}
          restore-keys: r9-images-amd64-
      - name: r9 fetch
        run: target/release/r9 fetch --row amd64
      - name: r9 image build
        run: target/release/r9 image build --row amd64 --accel kvm --out "$RUNNER_TEMP/image"
      - name: r9 build --side R
        env:
          R9_RUCC: ${{ github.workspace }}/rucc/target/release/rucc
          R9_OPT: -O2
        run: |
          target/release/r9 build --side R --row amd64 --accel kvm --keep --timeout 5400 --out /mnt/r9/r
          grep -qx 'kencc_calls = 0' /mnt/r9/r/build.toml
      - name: r9 fixedpoint
        run: target/release/r9 fixedpoint --r /mnt/r9/r/root.qcow2 --row amd64 --accel kvm --timeout 5400 --out /mnt/r9/fp
      - name: gather the results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp /mnt/r9/fp/fixedpoint.txt "$RUNNER_TEMP/out/" || true
          tail -5 /mnt/r9/fp/fixedpoint.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: p3-amd64-fp
          path: ${{ runner.temp }}/out
          retention-days: 30

  g:
    name: G user space
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-utils qemu-system-x86
          sudo mkdir -p /mnt/r9 && sudo chown "$USER" /mnt/r9
      - name: cargo build
        run: cargo build --release --locked -p r9
      - uses: actions/cache@v6.1.0
        with:
          path: /mnt/r9/images
          key: r9-images-amd64-${{ hashFiles('pins.toml') }}
          restore-keys: r9-images-amd64-
      - name: r9 fetch
        run: target/release/r9 fetch --row amd64
      - name: r9 image build
        run: target/release/r9 image build --row amd64 --accel kvm --out "$RUNNER_TEMP/image"
      - name: r9 build --side G
        run: target/release/r9 build --side G --row amd64 --accel kvm --timeout 5400 --out /mnt/r9/g
      - name: gather the results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/walk/g"
          cp /mnt/r9/g/collected/walk /mnt/r9/g/collected/changed.sha256 /mnt/r9/g/collected/members.sha256 "$RUNNER_TEMP/walk/g/" || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: p3-amd64-walk-g
          path: ${{ runner.temp }}/walk/g
          retention-days: 30

  names:
    name: the names and the modes
    needs: [r, g]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo build
        run: cargo build --release --locked -p r9
      - uses: actions/download-artifact@v8.0.1
        with:
          name: p3-amd64-walk-r
          path: ${{ runner.temp }}/r/collected
      - uses: actions/download-artifact@v8.0.1
        with:
          name: p3-amd64-walk-g
          path: ${{ runner.temp }}/g/collected
      - name: r9 tree-diff --names
        run: |
          set -o pipefail
          target/release/r9 tree-diff "$RUNNER_TEMP/g" --with "$RUNNER_TEMP/r" --names | tee -a "$GITHUB_STEP_SUMMARY"
