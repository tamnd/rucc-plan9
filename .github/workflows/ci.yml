# The gate for each commit to the Rust workspace: formatting, lints and the unit tests.
#
# Nothing here builds a 9front tree. The parsers and the shim are tested with inline fixtures. The
# guest builds have their own workflows, and they can fail without blocking a change to r9.
#
# The monitor of 9h is a second Rust workspace in 9h/monitor, and the monitor job checks it on Linux and on
# macOS. CI hosts have no nested hypervisor, so the job does not boot a kernel.
#
# Actions are pinned to a patch version, so that a result can be reproduced from the commit alone.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  quick:
    name: format and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: macos arm64
            os: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo test
        run: cargo test --workspace

  monitor:
    name: 9h monitor on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: macos arm64
            os: macos-26
    defaults:
      run:
        working-directory: 9h/monitor
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: 9h/monitor
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The hosted Linux runners have KVM, and this rule lets the user of the job open /dev/kvm.
      # The KVM guest test then runs, and H9_NEED_KVM makes it fail when /dev/kvm does not open.
      - name: give the job /dev/kvm
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo H9_NEED_KVM=1 >> "$GITHUB_ENV"
      - name: cargo test
        run: cargo test --workspace
