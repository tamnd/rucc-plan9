# The gate for each commit to the Rust workspace: formatting, lints and the unit tests.
#
# Nothing here builds a 9front tree. The parsers and the shim are tested with inline fixtures. The
# guest builds have their own workflows, and they can fail without blocking a change to r9.
#
# The monitor of 9h is a second Rust workspace in 9h/monitor, and the monitor job checks it on Linux and on
# macOS. CI hosts have no nested hypervisor, so the job does not boot a kernel.
#
# Actions are pinned to a patch version, so that a result can be reproduced from the commit alone.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  quick:
    name: format and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
            kvm: need
          - name: linux arm64
            os: ubuntu-24.04-arm
            kvm: try
          - name: macos arm64
            os: macos-26
            kvm: none
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo test
        run: cargo test --workspace

  monitor:
    name: 9h monitor on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
            kvm: need
          - name: linux arm64
            os: ubuntu-24.04-arm
            kvm: try
          - name: macos arm64
            os: macos-26
            kvm: none
    defaults:
      run:
        working-directory: 9h/monitor
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: 9h/monitor
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The hosted x86-64 Linux runners have KVM, and this rule lets the user of the job open
      # /dev/kvm. The KVM guest test then runs, and H9_NEED_KVM makes it fail when /dev/kvm does
      # not open. The arm64 Linux runners can have no KVM. There the step gives /dev/kvm when it
      # is there, and the guest test runs only then.
      - name: give the job /dev/kvm
        if: matrix.kvm != 'none'
        run: |
          uname -r
          if [ "${{ matrix.kvm }}" = try ] && [ ! -e /dev/kvm ]; then echo "no /dev/kvm on this runner"; exit 0; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo H9_NEED_KVM=1 >> "$GITHUB_ENV"
      - name: cargo test
        run: cargo test --workspace
      # The X11 back end draws in a window of Xvfb and reads the pixels back. xvfb-run gives the
      # server a cookie in XAUTHORITY, so the test also uses the cookie.
      - name: the X11 window on Xvfb
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          H9_NEED_X11=1 xvfb-run -a -s '-screen 0 1280x1024x24' cargo test -p h9-gui x11
      # The Wayland back end shows an image in a window of sway on a headless output, and grim
      # reads the pixels back. The config of sway puts the window at 0,0 with no border.
      - name: the Wayland window on sway
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends sway grim
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          printf '%s\n' 'output HEADLESS-1 resolution 1280x1024 position 0 0' 'default_border none' 'default_floating_border none' 'for_window [app_id="9h"] floating enable, move position 0 0' > "$RUNNER_TEMP/sway.config"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c "$RUNNER_TEMP/sway.config" > "$RUNNER_TEMP/sway.log" 2>&1 &
          s=
          for i in $(seq 100); do
            s=$(ls "$XDG_RUNTIME_DIR" | grep -E '^wayland-[0-9]+$' | head -1)
            [ -n "$s" ] && break
            sleep 0.1
          done
          [ -n "$s" ] || { cat "$RUNNER_TEMP/sway.log"; exit 1; }
          WAYLAND_DISPLAY=$s H9_NEED_WAYLAND=1 cargo test -p h9-gui wayland || { cat "$RUNNER_TEMP/sway.log"; exit 1; }
