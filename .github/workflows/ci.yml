# The gate for each commit to the Rust workspace: formatting, lints and the unit tests.
#
# Nothing here builds a 9front tree. The parsers and the shim are tested with inline fixtures. The
# guest builds have their own workflows, and they can fail without blocking a change to r9.
#
# Actions are pinned to a patch version, so that a result can be reproduced from the commit alone.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  quick:
    name: format and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: macos arm64
            os: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo test
        run: cargo test --workspace
