# The 9h monitor (plan 10.8). It is a workspace of its own, because it is the only code of this
# repository that calls a hypervisor, and that needs unsafe code. The workspace of crates/ forbids
# unsafe code.
[workspace]
members = ["h9-vm", "h9-dev", "h9-hvf", "h9-9p", "h9"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/tamnd/rucc-plan9"

[workspace.dependencies]
h9-vm = { path = "h9-vm" }
h9-dev = { path = "h9-dev" }
h9-hvf = { path = "h9-hvf" }
h9-9p = { path = "h9-9p" }
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"

[profile.release]
lto = "thin"
